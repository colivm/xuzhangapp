# api.xuzhangapp.com reverse proxy.
# Deployed to /etc/nginx/sites-available/api.xuzhangapp.com.
server {
    listen 80;
    server_name api.xuzhangapp.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.xuzhangapp.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.xuzhangapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xuzhangapp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
    }
}
