# xuzhangapp.com static website and legal pages.
# Deployed to /etc/nginx/sites-available/xuzhangapp.com.
server {
    listen 80;
    listen [::]:80;
    server_name xuzhangapp.com www.xuzhangapp.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name xuzhangapp.com www.xuzhangapp.com;
    server_tokens off;

    root /opt/xuzhang/xuzhangapp/site;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/xuzhangapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xuzhangapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /legal/ {
        alias /opt/xuzhang/xuzhangapp/legal/;
    }
}
